server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html SIEMPRE se revalida (el hash de los bundles cambia en cada deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback: todas las rutas sirven index.html (Angular sin router, pero por seguridad)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets con hash (Angular outputHashing): cache inmutable de 1 año
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache agresivo para assets hasheados (Angular outputHashing)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # versiones legacy (v1/v2/v3) también cacheadas
    location /versions/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
