# PostgreSQL 18 — darknezz.dev
# Acceso via Traefik (TLS passthrough) en postgresql.darknezz.dev:5432
# NO expone puertos al host — solo accesible desde la red proxy

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /home/yami/data/volumes/postgres/data:/var/lib/postgresql/data
      - /home/yami/data/secrets/postgres-password.txt:/run/secrets/postgres_password:ro
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  postgres_password:
    file: /home/yami/data/secrets/postgres-password.txt

networks:
  proxy:
    external: true
