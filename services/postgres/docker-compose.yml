# PostgreSQL 18 — darknezz.dev
# Acceso directo en puerto 5432 (sin SSL por ahora)

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=yamidarknezz
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=darknezz
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - /home/yami/data/volumes/postgres/data:/var/lib/postgresql/data
      - /home/yami/data/secrets/postgres-password.txt:/run/secrets/postgres_password:ro
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamidarknezz -d darknezz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  postgres_password:
    file: /home/yami/data/secrets/postgres-password.txt

networks:
  proxy:
    external: true
