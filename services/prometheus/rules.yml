groups:
  - name: darknezz
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) no responde"
          description: "El target {{ $labels.job }} no responde desde hace 2 minutos."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAM al {{ $value | humanizePercentage }}"
          description: "Uso de memoria del host por encima del 85% durante 5 minutos."

      - alert: LowDiskSpaceRoot
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disco raíz con menos del 15% libre"
          description: "Queda {{ $value | humanizePercentage }} de espacio en / (boot)."

      - alert: LowDiskSpaceData
        expr: node_filesystem_avail_bytes{mountpoint="/home/yami/data"} / node_filesystem_size_bytes{mountpoint="/home/yami/data"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Volumen de datos con menos del 15% libre"
          description: "Queda {{ $value | humanizePercentage }} de espacio en /home/yami/data."

      - alert: HighLoad
        expr: node_load1 > 4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Carga del sistema alta: {{ $value }}"
          description: "Load average de 1 minuto por encima de 4 durante 10 minutos."
