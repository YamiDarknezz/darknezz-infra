# fail2ban — filtro para el access log JSON de Traefik v3
# El access log de Traefik es JSON: {...,"ClientHost":"<ip>",...,"DownstreamStatus":401,...}
# 40[0-9] matchea cualquier 4xx (401 auth, 403, 404). Para solo auth usar 401|403.
[Definition]
failregex = ^\{.*"ClientHost":"<HOST>".*"DownstreamStatus":40[0-9].*\}$
ignoreregex =
